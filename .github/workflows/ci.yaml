name: Build
on:
    push:
        branches:
            - "5.x"
    pull_request:
    schedule:
        - cron: '15 3 * * *'
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    phpstan:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7

            - name: Setup PHP, with composer and extensions
              uses: shivammathur/setup-php@v2
              with:
                  php-version: 8.4
                  coverage: none
                  tools: composer:2.9.8

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            - name: Cache Composer dependencies
              uses: actions/cache@v6
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: phpstan-${{ runner.os }}-php84-${{ hashFiles('composer.json') }}
                  restore-keys: phpstan-${{ runner.os }}-php84-

            - name: Install dependencies
              run: |
                  composer install --no-interaction --no-progress --prefer-dist

            - name: "Run PHPStan analysis"
              run: vendor/bin/phpstan analyse

    phpunit:
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix:
                include:
                    # LTS Symfony version on macOS and Windows (platform-specific issues)
                    - os: macos-latest
                      php_version: "8.4"
                      symfony_version: "7.4.*"
                      stability: "stable"
                      allow_failure: false
                    - os: windows-latest
                      php_version: "8.4"
                      symfony_version: "7.4.*"
                      stability: "stable"
                      allow_failure: false
                    # Lowest deps support
                    - os: ubuntu-latest
                      php_version: "8.2"
                      composer_args: "--prefer-lowest"
                      stability: "stable"
                      phpunit_args: "--do-not-fail-on-deprecation --do-not-fail-on-phpunit-deprecation"
                      allow_failure: false
                    # Doctrine combinations allowed by composer.json that the other jobs don't install:
                    # ORM 3 with DBAL 3 (and the first PHP 8.3 job) and the latest ORM 2.20 release
                    # (which needs DBAL 3 and doctrine-bundle 2.x). Without the native lazy objects of
                    # PHP 8.4 and ORM 3.4+, Doctrine creates lazy ghost objects with
                    # ProxyHelper::generateLazyGhost(), deprecated since symfony/var-exporter 7.3, and
                    # disabling them triggers another ORM deprecation, so these jobs can't fail on them
                    - os: ubuntu-latest
                      php_version: "8.3"
                      symfony_version: "7.4.*"
                      composer_args: "--with 'doctrine/dbal:^3.10'"
                      stability: "stable"
                      phpunit_args: "--do-not-fail-on-deprecation"
                      allow_failure: false
                    - os: ubuntu-latest
                      php_version: "8.4"
                      symfony_version: "7.4.*"
                      composer_args: "--with 'doctrine/orm:^2.20'"
                      stability: "stable"
                      phpunit_args: "--do-not-fail-on-deprecation"
                      allow_failure: false
                    # All supported Symfony versions
                    # Symfony 7.1, 7.2, 7.3 and 8.0 are no longer maintained and their last twig-bridge
                    # releases call TemplateWrapper::unwrap() without the Environment argument that
                    # twig/twig 3.29 requires, so those jobs pin Twig to the last working version.
                    - os: ubuntu-latest
                      php_version: "8.4"
                      symfony_version: "6.4.*"
                      stability: "stable"
                      allow_failure: false
                    - os: ubuntu-latest
                      php_version: "8.4"
                      symfony_version: "7.1.*"
                      composer_args: "--with 'twig/twig:<3.29'"
                      stability: "stable"
                      phpunit_args: "--do-not-fail-on-deprecation --do-not-fail-on-phpunit-deprecation"
                      allow_failure: false
                    - os: ubuntu-latest
                      php_version: "8.4"
                      symfony_version: "7.2.*"
                      composer_args: "--with 'twig/twig:<3.29'"
                      stability: "stable"
                      allow_failure: false
                    - os: ubuntu-latest
                      php_version: "8.4"
                      symfony_version: "7.3.*"
                      composer_args: "--with 'twig/twig:<3.29'"
                      stability: "stable"
                      allow_failure: false
                    - os: ubuntu-latest
                      php_version: "8.4"
                      symfony_version: "7.4.*"
                      stability: "stable"
                      allow_failure: false
                    # Symfony 8.0 is no longer maintained and its last doctrine-bridge release (8.0.15)
                    # calls GenerateSchemaEventArgs::setSchema(), which doctrine/orm >= 3.6.8 only accepts
                    # when doctrine/dbal >= 4.5 is installed (see symfony/symfony#65235). Composer installs
                    # DBAL 4.5 now, so don't pin the ORM: doctrine/orm < 3.6.8 triggers DBAL 4.5 deprecations.
                    - os: ubuntu-latest
                      php_version: "8.4"
                      symfony_version: "8.0.*"
                      composer_args: "--with 'twig/twig:<3.29'"
                      stability: "stable"
                      allow_failure: false
                    - os: ubuntu-latest
                      php_version: "8.4"
                      symfony_version: "8.1.*"
                      stability: "stable"
                      allow_failure: false
                    # Upcoming Symfony version
                    - os: ubuntu-latest
                      php_version: "8.5"
                      symfony_version: "8.2.*@dev"
                      stability: "dev"
                      allow_failure: true
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v7

            - name: Setup PHP, with composer and extensions
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php_version }}
                  coverage: none
                  extensions: mbstring, intl, pdo, pdo_sqlite, sqlite3, fileinfo
                  ini-values: date.timezone=UTC
                  tools: composer:2.9.8

            - name: Get Composer cache directory
              id: composer-cache
              shell: bash
              run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            - name: Cache Composer dependencies
              uses: actions/cache@v6
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: phpunit-${{ runner.os }}-php${{ matrix.php_version }}-${{ matrix.symfony_version || 'default' }}-${{ matrix.composer_args || 'normal' }}-${{ matrix.stability }}-${{ hashFiles('composer.json') }}
                  restore-keys: phpunit-${{ runner.os }}-php${{ matrix.php_version }}-

            - name: symfony/flex is required to install the correct symfony version
              if: ${{ matrix.symfony_version }}
              run: |
                  composer global config --no-plugins allow-plugins.symfony/flex true
                  composer global require symfony/flex

            - name: Configure Composer stability
              run: |
                  composer config minimum-stability ${{ matrix.stability }}

            - name: Configure Symfony version for symfony/flex
              if: ${{ matrix.symfony_version }}
              run: composer config extra.symfony.require "${{ matrix.symfony_version }}"

            - name: Disable Composer audit feature
              # this is needed because Composer installation fails when every matched
              # version of a dependency has an open security advisory, which is the case
              # for packages that are no longer updated so no non-vulnerable patch exists
              run: |
                  composer config audit.block-insecure false

            - name: Install dependencies
              run: |
                  composer update --no-interaction --no-progress --prefer-dist ${{ matrix.composer_args }}

            - name: Show installed dependencies
              run: |
                  composer show

            - name: Run tests
              if: ${{ runner.os != 'Windows' }}
              shell: bash
              run: |
                  set +e
                  make tests ARGS="${{ matrix.phpunit_args }}"
                  exit_code=$?

                  if [ "${{ matrix.allow_failure }}" = "true" ] && [ $exit_code -ne 0 ]; then
                      echo "::warning::Experimental job failed (php ${{ matrix.php_version }}, symfony ${{ matrix.symfony_version }}), but it's allowed to fail."
                      exit 0
                  fi

                  exit $exit_code

            - name: Run tests (Windows)
              if: ${{ runner.os == 'Windows' }}
              shell: pwsh
              run: |
                  $cacheDir = php -r "echo sys_get_temp_dir();"
                  $cacheDir = Join-Path $cacheDir "com.github.easycorp.easyadmin/tests/var/test/cache"
                  if (Test-Path $cacheDir) { Remove-Item -Recurse -Force $cacheDir }
                  php vendor/bin/phpunit
                  $exitCode = $LASTEXITCODE

                  if ("${{ matrix.allow_failure }}" -eq "true" -and $exitCode -ne 0) {
                      Write-Output "::warning::Experimental job failed (php ${{ matrix.php_version }}, symfony ${{ matrix.symfony_version }}), but it's allowed to fail."
                      exit 0
                  }

                  exit $exitCode

    # the functional tests on database servers; GitHub only runs Linux containers on Ubuntu runners
    phpunit-databases:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                db: [postgres, mysql, mariadb]
        steps:
            - uses: actions/checkout@v7

            - name: Setup PHP, with composer and extensions
              uses: shivammathur/setup-php@v2
              with:
                  php-version: 8.4
                  coverage: none
                  extensions: mbstring, intl, pdo, pdo_sqlite, pdo_pgsql, pdo_mysql, fileinfo
                  ini-values: date.timezone=UTC
                  tools: composer:2.9.8

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            - name: Cache Composer dependencies
              uses: actions/cache@v6
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: phpunit-databases-${{ runner.os }}-php84-${{ hashFiles('composer.json') }}
                  restore-keys: phpunit-databases-${{ runner.os }}-php84-

            - name: symfony/flex is required to install the correct symfony version
              run: |
                  composer global config --no-plugins allow-plugins.symfony/flex true
                  composer global require symfony/flex

            - name: Configure Symfony version for symfony/flex
              run: composer config extra.symfony.require "7.4.*"

            - name: Disable Composer audit feature
              run: |
                  composer config audit.block-insecure false

            - name: Install dependencies
              run: |
                  composer update --no-interaction --no-progress --prefer-dist

            - name: Show installed dependencies
              run: |
                  composer show

            - name: Run tests
              run: make tests-db DB=${{ matrix.db }}

    php-linter:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7

            # see https://github.com/OskarStark/php-cs-fixer-ga
            - name: PHP-CS-Fixer
              uses: docker://oskarstark/php-cs-fixer-ga
              with:
                  args: --diff --dry-run

    doc-linter:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7

            - name: DOCtor-RST
              uses: docker://oskarstark/doctor-rst
              with:
                  args: --short
              env:
                  DOCS_DIR: "doc/"

    css-linter:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7

            - name: Setup PHP, with composer and extensions
              uses: shivammathur/setup-php@v2
              with:
                  php-version: 8.2
                  coverage: none
                  tools: composer:2.9.8

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            - name: Cache Composer dependencies
              uses: actions/cache@v6
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: css-${{ runner.os }}-${{ hashFiles('composer.json') }}
                  restore-keys: css-${{ runner.os }}-

            - name: Install dependencies
              run: |
                  composer install --no-interaction --no-progress --prefer-dist

            -   name: Lint logical CSS properties
                run: |
                    php ./src/Resources/bin/logical-css-properties-linter.php

    twig-linter:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7

            - name: Setup PHP, with composer and extensions
              uses: shivammathur/setup-php@v2
              with:
                  php-version: 8.2
                  coverage: none
                  tools: composer:2.9.8

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            - name: Cache Composer dependencies
              uses: actions/cache@v6
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: twig-${{ runner.os }}-${{ hashFiles('composer.json') }}
                  restore-keys: twig-${{ runner.os }}-

            - name: Install dependencies
              run: |
                  composer install --no-interaction --no-progress --prefer-dist

            -   name: Lint Twig template syntax
                run: |
                    vendor/bin/twig-cs-fixer lint templates/ --report=github

    js-linter:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
            - run: corepack enable
            - uses: actions/setup-node@v7
              with:
                  cache: 'yarn'
                  cache-dependency-path: 'yarn.lock'
            - run: yarn --immutable
            - run: yarn ci
